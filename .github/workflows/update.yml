name: Update Opernhaus Zürich calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python build_calendar.py
      - name: Commit updated subscription
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opernhaus-zurich.ics
          if ! git diff --cached --quiet; then
            git commit -m 'Update Opernhaus Zürich calendar'
            git push
          fi
